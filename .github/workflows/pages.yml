# Builds the pages and publishes them to GitHub Pages:
#   https://rowanp4069.github.io/Brisbane-River-tides/             predictions
#   https://rowanp4069.github.io/Brisbane-River-tides/gauges.html  measured gauges
#   https://rowanp4069.github.io/Brisbane-River-tides/compare.html measured vs predicted
# The generated HTML is not committed; each run makes a fresh one.
#
# Needs, once: repo Settings -> Pages -> Source: GitHub Actions.
# Note: GitHub turns off scheduled runs in a public repo after 60 days with no
# commits. Re-enable it from the Actions tab if the page stops updating.
name: Publish page

on:
  push:
    branches: [main]
  schedule:
    # 14:10 UTC = 00:10 AEST (Brisbane has no daylight saving). Scheduled runs can
    # start late at busy times, which is fine for a tide page.
    - cron: "10 14 * * *"
  workflow_dispatch:      # "Run workflow" button in the Actions tab
  # Rebuild when the daily gauge collection finishes, so compare.html has its
  # readings the same day (the nightly run above comes before the collection).
  workflow_run:
    workflows: ["Collect gauges"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; let a running one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      # The measured readings live on the gauge-data branch; compare_gauges.py reads
      # them from origin/gauge-data (and check_parity.py checks the compare page).
      - run: git fetch --depth=1 origin +refs/heads/gauge-data:refs/remotes/origin/gauge-data
      # Stop before publishing if the page's model and river_tides.py disagree.
      # Node.js comes with GitHub's Ubuntu runners.
      - run: python check_parity.py
      # The page carries the Bar data for every committed year and opens on the
      # viewer's today, so a rebuild isn't needed to keep it current; the nightly run
      # refreshes the "Predictions built ... AEST" stamp (--stamp) and shows breakage early.
      - run: python river_tides.py --stamp --out site/index.html
      # The gauges page fetches its readings live; this only builds the page itself.
      - run: python build_gauges.py --stamp --out site/gauges.html
      # Measured vs predicted: the readings saved so far, compared with the model.
      - run: python compare_gauges.py --stamp --out site/compare.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
