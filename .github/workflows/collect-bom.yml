# Saves Bureau of Meteorology river heights for the Brisbane River gauges (incl.
# 540063 Colleges Crossing and 540256 Kholo Bridge) to the gauge-data branch, from
# the basin bulletin IDQ60286 on BoM's public anonymous FTP. The bulletin holds only
# each gauge's latest reading, so this runs every 15 min. GitHub delays and sometimes
# skips scheduled runs, so expect gaps; BoM's web table for a gauge keeps about two
# weeks and can be read by hand in a browser to fill them (never fetched by script).
#
# Note: GitHub turns off scheduled runs in a public repo after 60 days with no
# activity. Re-enable it from the Actions tab if the data stops growing.
name: Collect BoM river heights

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:      # "Run workflow" button in the Actions tab

permissions:
  contents: write         # to push to the gauge-data branch

# Its own group: sharing one with the daily job would let a queued 15-min run cancel
# a queued daily run. The two write different folders, so pushes are retried after a
# rebase instead.
concurrency:
  group: collect-bom
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code (main)
        uses: actions/checkout@v5
        with:
          path: code
      - name: Check out the data (gauge-data)
        uses: actions/checkout@v5
        with:
          ref: gauge-data
          path: data
      - name: Collect
        run: python3 code/collect_gauges.py --out data --sources bom
      - name: Commit new readings
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new readings."
            exit 0
          fi
          git commit -q -m "Collect BoM $(TZ=Australia/Brisbane date '+%Y-%m-%d %H:%M') AEST"
          for i in 1 2 3; do
            git pull -q --rebase origin gauge-data && git push -q origin gauge-data && exit 0
            sleep 10
          done
          exit 1
